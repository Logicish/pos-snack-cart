[env:mingwu-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1  ; this board's "UART" USB port is the native USB-Serial/JTAG
                                 ; peripheral, not an external CH340 bridge (confirmed via
                                 ; rst:0x15 USB_UART_CHIP_RESET on connect) — Serial must bind
                                 ; to native USB CDC, not physical UART0 pins, to reach this cable
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; TFT_eSPI — defined here so library .cpp files see them, not just main.cpp
    -DUSE_FSPI_PORT
    -DUSER_SETUP_LOADED
    -DILI9488_DRIVER
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_CS=8
    -DTFT_DC=10
    -DTFT_RST=9
    -DTFT_BL=18
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ 8.4.0
    siara-cc/Sqlite3Esp32
    esphome/ESPAsyncWebServer-esphome
    esphome/AsyncTCP-esphome
    adafruit/RTClib @ ^2.1.4

upload_port = COM3        ; update to your actual COM port number
monitor_port = COM3       ; same port as upload — one cable for everything
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
